[workspace]
members = [
  "apps/vda5050-demo",
  "apps/vda5050-doctor",
  "crates/vda5050-core",
  "crates/vda5050-doctor",
  "crates/vda5050-import",
  "crates/vda5050-local-fs",
  "crates/vda5050-protocol",
  "crates/vda5050-report",
  "crates/vda5050-sim-core",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Daisuke Kuriyama"]
homepage = "https://github.com/ekusiadadus/vda5050-lab"
repository = "https://github.com/ekusiadadus/vda5050-lab"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
cap-fs-ext = "4.0"
cap-primitives = "4.0"
hex = "0.4"
rustix = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
vda5050-local-fs = { version = "0.2.0", path = "crates/vda5050-local-fs" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
