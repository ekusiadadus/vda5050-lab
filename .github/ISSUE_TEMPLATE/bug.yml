name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: Data safety
      options:
        - label: This report contains no customer trace, credential, or sensitive warehouse data.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: vda5050-doctor 0.2.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Ubuntu 24.04 x86-64
    validations:
      required: true
  - type: dropdown
    id: input-format
    attributes:
      label: Input format
      options:
        - canonical-jsonl
        - envelope-jsonl
        - envelope-array
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal synthetic reproducer
      description: Attach only invented or independently authorized data.
      render: json
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
