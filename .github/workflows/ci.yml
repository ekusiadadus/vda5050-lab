name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Lint workflows and release shell scripts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
          shellcheck \
            scripts/verify-release-tag.sh \
            scripts/normalize-cyclonedx.sh \
            scripts/verify-release-assets.sh \
            scripts/render-demo-video.sh \
            scripts/render-fleet-media.sh \
            scripts/run-tier1-demo.sh \
            scripts/run-tier1-fleet-suite.sh \
            tests/release_contract.sh \
            tests/fleet_media_contract.sh \
            tests/fleet_release_contract.sh \
            tests/tier1_demo_e2e.sh \
            tests/tier1_demo_verdict_matrix.sh \
            tests/tier1_multirobot_contract.sh \
            tests/tier1_multirobot_e2e.sh

      - name: Verify release contracts
        run: |
          bash tests/release_contract.sh
          bash tests/fleet_release_contract.sh

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt,llvm-tools-preview

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --locked

      - name: Run isolated Tier 1 demo contracts
        run: make demo-e2e

      - name: Install pinned coverage tool
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Enforce line and region coverage floors
        run: cargo llvm-cov --workspace --all-targets --exclude vda5050-demo --fail-under-lines 80 --fail-under-regions 80

      - name: Install pinned RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock

      - name: Install pinned license and source auditor
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Enforce dependency policy
        run: cargo deny check

  demo:
    name: Isolated Tier 1 fleet E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify verdict matrix and all fixed fleet scales
        run: |
          make demo-e2e
          make demo-fleet-e2e
