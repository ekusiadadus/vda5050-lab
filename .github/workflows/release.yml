name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to validate without publishing
        required: true
        default: v0.2.0

permissions: {}

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  # Every job checks out the immutable event commit. The annotated tag is
  # validated separately and again immediately before publication.
  RELEASE_SOURCE_REF: ${{ github.sha }}

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out annotated tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt,llvm-tools-preview

      - name: Validate version, tag, notes, and rule digest
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vda5050-doctor") | .version')"
          test "$RELEASE_TAG" = "v$version"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            bash scripts/verify-release-tag.sh "$RELEASE_TAG" "$GITHUB_SHA"
          fi
          test -f "docs/releases/$RELEASE_TAG.md"
          grep -Fq "## [$version]" CHANGELOG.md
          catalog_digest="$(sha256sum rules/phase1.json | cut -d ' ' -f 1)"
          catalog_bytes="$(wc -c < rules/phase1.json | tr -d ' ')"
          test "$catalog_digest" = "$(jq -r '.rule_implementation_digest' bundles/manifests/vda5050-3.0.0.phase1.bundle.json)"
          test "$catalog_digest" = "$(jq -r '.artifacts["rules/phase1.json"].sha256' bundles/manifests/vda5050-3.0.0.phase1.bundle.json)"
          test "$catalog_digest" = "$(jq -r '.project_rule_catalog.sha256' bundles/manifests/vda5050-3.0.0.sources.json)"
          test "$catalog_bytes" = "$(jq -r '.project_rule_catalog.bytes' bundles/manifests/vda5050-3.0.0.sources.json)"

      - name: Run formatting, lint, and tests
        run: make fmt-check lint test

      - name: Verify release and fleet media contracts
        run: |
          bash tests/release_contract.sh
          bash tests/fleet_release_contract.sh

      - name: Install pinned coverage tool
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Enforce line and region coverage floors
        run: cargo llvm-cov --workspace --all-targets --exclude vda5050-demo --fail-under-lines 80 --fail-under-regions 80

      - name: Install pinned RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock

      - name: Install pinned license and source auditor
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Enforce dependency policy
        run: cargo deny check

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: vda5050-doctor
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: vda5050-doctor
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: vda5050-doctor
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: vda5050-doctor.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Install pinned Rust toolchain and target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add "${{ matrix.target }}" --toolchain 1.97.1

      - name: Run native platform contract tests
        shell: bash
        run: cargo test --workspace --all-targets --locked --target "${{ matrix.target }}"

      - name: Resolve the checked-out source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$source_commit" = "$GITHUB_SHA"
          fi
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        shell: bash
        env:
          VDA5050_BUILD_COMMIT: ${{ steps.source.outputs.commit }}
        run: cargo build --release --locked --bin vda5050-doctor --target "${{ matrix.target }}"

      - name: Verify embedded release version
        if: runner.os != 'Windows'
        shell: bash
        run: "target/${{ matrix.target }}/release/${{ matrix.binary }} --version"

      - name: Verify embedded release version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: "target/${{ matrix.target }}/release/${{ matrix.binary }} --version"

      - name: Package binary and provenance documents
        shell: bash
        run: |
          set -euo pipefail
          package="vda5050-doctor-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/$package/rules" "dist/$package/bundles/manifests" "dist/$package/docs"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$package/"
          cp LICENSE README.md CHANGELOG.md "dist/$package/"
          cp rules/phase1.json "dist/$package/rules/"
          cp bundles/manifests/vda5050-3.0.0.sources.json "dist/$package/bundles/manifests/"
          cp bundles/manifests/vda5050-3.0.0.phase1.bundle.json "dist/$package/bundles/manifests/"
          cp docs/PROTOCOL_SOURCES.md "dist/$package/docs/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"

      - name: Upload native archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/vda5050-doctor-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: Generate CycloneDX SBOM
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install pinned CycloneDX generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate binary-scoped SBOM
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$source_commit" = "$GITHUB_SHA"
          fi
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          cargo cyclonedx --manifest-path apps/vda5050-doctor/Cargo.toml --format json --describe binaries --target all --spec-version 1.5
          mkdir -p dist
          mv apps/vda5050-doctor/vda5050-doctor_bin.cdx.json "dist/vda5050-doctor-${RELEASE_TAG}.cdx.json"
          bash scripts/normalize-cyclonedx.sh \
            "dist/vda5050-doctor-${RELEASE_TAG}.cdx.json" \
            "$RELEASE_TAG" \
            "$source_commit"

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sbom
          path: dist/vda5050-doctor-${{ env.RELEASE_TAG }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  demo:
    name: Render fixed fleet media suite
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Resolve the checked-out source commit
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$source_commit" = "$GITHUB_SHA"
          fi

      - name: Install video renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg \
            fonts-dejavu-core \
            imagemagick \
            librsvg2-bin
          ffmpeg -version | head -n 1
          convert -version | head -n 1
          identify -version | head -n 1
          rsvg-convert --version

      - name: Verify renderer fixtures and render isolated fleet media
        shell: bash
        run: |
          set -euo pipefail
          make demo-e2e
          bash tests/fleet_media_contract.sh
          make demo-video RELEASE_TAG="$RELEASE_TAG"
          release_dir="$GITHUB_WORKSPACE/dist"
          bash scripts/verify-release-assets.sh media "$release_dir" "$RELEASE_TAG"

      - name: Upload exact fleet media allowlist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-demo
          path: |
            dist/vda5050-fleet-001-${{ env.RELEASE_TAG }}.mp4
            dist/vda5050-fleet-001-${{ env.RELEASE_TAG }}.gif
            dist/vda5050-fleet-002-${{ env.RELEASE_TAG }}.mp4
            dist/vda5050-fleet-002-${{ env.RELEASE_TAG }}.gif
            dist/vda5050-fleet-005-${{ env.RELEASE_TAG }}.mp4
            dist/vda5050-fleet-005-${{ env.RELEASE_TAG }}.gif
            dist/vda5050-fleet-010-${{ env.RELEASE_TAG }}.mp4
            dist/vda5050-fleet-010-${{ env.RELEASE_TAG }}.gif
            dist/vda5050-fleet-050-${{ env.RELEASE_TAG }}.mp4
            dist/vda5050-fleet-050-${{ env.RELEASE_TAG }}.gif
            dist/vda5050-fleet-100-${{ env.RELEASE_TAG }}.mp4
            dist/vda5050-fleet-100-${{ env.RELEASE_TAG }}.gif
            dist/vda5050-fleet-overview-${{ env.RELEASE_TAG }}.mp4
            dist/vda5050-fleet-overview-${{ env.RELEASE_TAG }}.gif
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble and preflight release payload
    needs:
      - build
      - sbom
      - demo
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Download Linux x86_64 archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/release-dist

      - name: Download Linux aarch64 archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-aarch64-unknown-linux-gnu
          path: ${{ runner.temp }}/release-dist

      - name: Download macOS aarch64 archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-aarch64-apple-darwin
          path: ${{ runner.temp }}/release-dist

      - name: Download Windows x86_64 archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/release-dist

      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-sbom
          path: ${{ runner.temp }}/release-dist

      - name: Download demo video
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-demo
          path: ${{ runner.temp }}/release-dist

      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release-dist"
          bash scripts/verify-release-assets.sh assemble "$release_dir" "$RELEASE_TAG"

      - name: Validate attestation compatibility
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .bomFormat == "CycloneDX" and
            (.serialNumber | type) == "string" and
            (.serialNumber | length) > 0 and
            (.specVersion | type) == "string"
          ' "$RUNNER_TEMP/release-dist/vda5050-doctor-${RELEASE_TAG}.cdx.json" >/dev/null

      - name: Upload assembled release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-payload
          path: |
            ${{ runner.temp }}/release-dist/vda5050-doctor-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz
            ${{ runner.temp }}/release-dist/vda5050-doctor-${{ env.RELEASE_TAG }}-aarch64-unknown-linux-gnu.tar.gz
            ${{ runner.temp }}/release-dist/vda5050-doctor-${{ env.RELEASE_TAG }}-aarch64-apple-darwin.tar.gz
            ${{ runner.temp }}/release-dist/vda5050-doctor-${{ env.RELEASE_TAG }}-x86_64-pc-windows-msvc.tar.gz
            ${{ runner.temp }}/release-dist/vda5050-doctor-${{ env.RELEASE_TAG }}.cdx.json
            ${{ runner.temp }}/release-dist/vda5050-fleet-001-${{ env.RELEASE_TAG }}.mp4
            ${{ runner.temp }}/release-dist/vda5050-fleet-001-${{ env.RELEASE_TAG }}.gif
            ${{ runner.temp }}/release-dist/vda5050-fleet-002-${{ env.RELEASE_TAG }}.mp4
            ${{ runner.temp }}/release-dist/vda5050-fleet-002-${{ env.RELEASE_TAG }}.gif
            ${{ runner.temp }}/release-dist/vda5050-fleet-005-${{ env.RELEASE_TAG }}.mp4
            ${{ runner.temp }}/release-dist/vda5050-fleet-005-${{ env.RELEASE_TAG }}.gif
            ${{ runner.temp }}/release-dist/vda5050-fleet-010-${{ env.RELEASE_TAG }}.mp4
            ${{ runner.temp }}/release-dist/vda5050-fleet-010-${{ env.RELEASE_TAG }}.gif
            ${{ runner.temp }}/release-dist/vda5050-fleet-050-${{ env.RELEASE_TAG }}.mp4
            ${{ runner.temp }}/release-dist/vda5050-fleet-050-${{ env.RELEASE_TAG }}.gif
            ${{ runner.temp }}/release-dist/vda5050-fleet-100-${{ env.RELEASE_TAG }}.mp4
            ${{ runner.temp }}/release-dist/vda5050-fleet-100-${{ env.RELEASE_TAG }}.gif
            ${{ runner.temp }}/release-dist/vda5050-fleet-overview-${{ env.RELEASE_TAG }}.mp4
            ${{ runner.temp }}/release-dist/vda5050-fleet-overview-${{ env.RELEASE_TAG }}.gif
            ${{ runner.temp }}/release-dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish Developer Preview
    if: github.event_name == 'push'
    needs:
      - assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - name: Check out release notes and tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Revalidate annotated tag and source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-release-tag.sh "$RELEASE_TAG" "$GITHUB_SHA" origin

      - name: Download assembled release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-payload
          path: ${{ runner.temp }}/release-dist

      - name: Verify the immutable payload allowlist and checksums
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release-dist"
          bash scripts/verify-release-assets.sh verify "$release_dir" "$RELEASE_TAG"

      - name: Create SLSA build-provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release-dist/SHA256SUMS

      - name: Create CycloneDX SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-dist/vda5050-doctor-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz
            ${{ runner.temp }}/release-dist/vda5050-doctor-${{ env.RELEASE_TAG }}-aarch64-unknown-linux-gnu.tar.gz
            ${{ runner.temp }}/release-dist/vda5050-doctor-${{ env.RELEASE_TAG }}-aarch64-apple-darwin.tar.gz
            ${{ runner.temp }}/release-dist/vda5050-doctor-${{ env.RELEASE_TAG }}-x86_64-pc-windows-msvc.tar.gz
          sbom-path: ${{ runner.temp }}/release-dist/vda5050-doctor-${{ env.RELEASE_TAG }}.cdx.json

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-release-tag.sh "$RELEASE_TAG" "$GITHUB_SHA" origin
          release_dir="$RUNNER_TEMP/release-dist"
          assets=(
            "$release_dir/vda5050-doctor-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "$release_dir/vda5050-doctor-${RELEASE_TAG}-aarch64-unknown-linux-gnu.tar.gz"
            "$release_dir/vda5050-doctor-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz"
            "$release_dir/vda5050-doctor-${RELEASE_TAG}-x86_64-pc-windows-msvc.tar.gz"
            "$release_dir/vda5050-doctor-${RELEASE_TAG}.cdx.json"
            "$release_dir/vda5050-fleet-001-${RELEASE_TAG}.mp4"
            "$release_dir/vda5050-fleet-001-${RELEASE_TAG}.gif"
            "$release_dir/vda5050-fleet-002-${RELEASE_TAG}.mp4"
            "$release_dir/vda5050-fleet-002-${RELEASE_TAG}.gif"
            "$release_dir/vda5050-fleet-005-${RELEASE_TAG}.mp4"
            "$release_dir/vda5050-fleet-005-${RELEASE_TAG}.gif"
            "$release_dir/vda5050-fleet-010-${RELEASE_TAG}.mp4"
            "$release_dir/vda5050-fleet-010-${RELEASE_TAG}.gif"
            "$release_dir/vda5050-fleet-050-${RELEASE_TAG}.mp4"
            "$release_dir/vda5050-fleet-050-${RELEASE_TAG}.gif"
            "$release_dir/vda5050-fleet-100-${RELEASE_TAG}.mp4"
            "$release_dir/vda5050-fleet-100-${RELEASE_TAG}.gif"
            "$release_dir/vda5050-fleet-overview-${RELEASE_TAG}.mp4"
            "$release_dir/vda5050-fleet-overview-${RELEASE_TAG}.gif"
            "$release_dir/SHA256SUMS"
          )
          test "$(find "$release_dir" -mindepth 1 -maxdepth 1 | wc -l)" -eq "${#assets[@]}"
          for asset in "${assets[@]}"; do
            test -f "$asset"
            test ! -L "$asset"
          done
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "vda5050-doctor $RELEASE_TAG — Developer Preview" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            --prerelease
